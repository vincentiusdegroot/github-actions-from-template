name: GitHub Actions Demo
on:
  push:
    branches: [ "main" ] 
    paths-ignore: [".github/**"]
  pull_request:
    branches: [ "main" ]
  schedule:
  - cron: 15 6 * * 0
  workflow_dispatch:
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - run: echo Triggered from ${{ github.event_name }} branch name ${{github.ref }}

      - uses: actions/checkout@v4
      - name: List files
        run: |
          echo Files in repo:
          tree
